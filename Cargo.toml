[package]
name = "benchrun"
version = "1.1.0"
edition = "2021"
authors = ["Sudarshan Chaudhari <sunny.sudarshan@gmail.com>"]
description = "Device benchmark runner for CPU and memory checks on digital signage players"
license = "MIT"
repository = "https://github.com/SUDARSHANCHAUDHARI/RustPlayerBenchAI"
readme = "README.md"
keywords = ["benchmark", "device", "cpu", "memory", "cli"]
categories = ["command-line-utilities", "development-tools::profiling"]

[lib]
name = "benchrun"
path = "src/lib.rs"

[[bin]]
name = "benchrun"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
thiserror = "2"
colored = "2"
chrono = { version = "0.4", features = ["serde"] }

[dev-dependencies]
assert_cmd = "2"
predicates = "3"
